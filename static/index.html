<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Restaurant Order Agent</title>
<style>
  :root {
    --bg: #f7f5f2;
    --panel: #ffffff;
    --border: #e6e1da;
    --text: #2b2620;
    --muted: #8a8377;
    --accent: #b5501e;
    --accent-fg: #ffffff;
    --user-bubble: #2b2620;
    --user-fg: #ffffff;
    --bot-bubble: #f1ede6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    min-height: 100vh;
  }
  .app {
    width: 100%;
    max-width: 640px;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  header h1 {
    font-size: 16px;
    margin: 0 0 4px;
  }
  header .meta {
    font-size: 12px;
    color: var(--muted);
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }
  header .meta span b { color: var(--text); }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.45;
    white-space: pre-wrap;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--user-bubble);
    color: var(--user-fg);
    border-bottom-right-radius: 4px;
  }
  .msg.bot {
    align-self: flex-start;
    background: var(--bot-bubble);
    border-bottom-left-radius: 4px;
  }
  .msg.error {
    align-self: center;
    background: #fbe4e0;
    color: #9c2f1c;
    font-size: 13px;
  }
  .msg.pending { opacity: 0.6; }
  form {
    display: flex;
    gap: 8px;
    padding: 14px 20px;
    border-top: 1px solid var(--border);
    background: var(--panel);
  }
  input[type=text] {
    flex: 1;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 999px;
    font-size: 14px;
    outline: none;
  }
  input[type=text]:focus { border-color: var(--accent); }
  button {
    padding: 10px 18px;
    border: none;
    border-radius: 999px;
    background: var(--accent);
    color: var(--accent-fg);
    font-size: 14px;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button.secondary {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
  }
  .quick-actions {
    display: flex;
    gap: 6px;
    padding: 0 20px 12px;
    flex-wrap: wrap;
  }
  .quick-actions button {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    font-size: 12px;
    padding: 6px 12px;
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>🍽️ Restaurant Order Agent</h1>
    <div class="meta">
      <span>Status: <b id="status">browsing</b></span>
      <span>Cart items: <b id="cart-count">0</b></span>
      <span>Order: <b id="order-id">none</b></span>
      <button class="secondary" id="reset" type="button" style="margin-left:auto; padding:2px 10px;">New user</button>
    </div>
  </header>

  <div id="messages"></div>

  <div class="quick-actions">
    <button type="button" data-msg="show me the menu">Show menu</button>
    <button type="button" data-msg="show my cart">View cart</button>
    <button type="button" id="checkout-btn">Checkout</button>
  </div>

  <form id="chat-form">
    <input id="input" type="text" placeholder="I'd like 2 pizzas and a coke..." autocomplete="off" />
    <button type="submit">Send</button>
  </form>
</div>

<script>
(function () {
  const API_BASE = "";
  const messagesEl = document.getElementById("messages");
  const form = document.getElementById("chat-form");
  const input = document.getElementById("input");
  const statusEl = document.getElementById("status");
  const cartCountEl = document.getElementById("cart-count");
  const orderIdEl = document.getElementById("order-id");
  const resetBtn = document.getElementById("reset");

  let sessionId = null;
  try { sessionId = localStorage.getItem("session_id"); } catch (e) {}

  // A fresh key per checkout *attempt* on the current cart - reused if
  // the button is clicked again before the cart changes, so a double
  // click (or a retry after a dropped connection) hits the same
  // Idempotency-Key and the backend's /checkout returns the SAME order
  // instead of creating a second one. Regenerated after any successful
  // chat turn that changes the cart (add/remove), since that's a new
  // checkout-worthy state.
  let checkoutIdempotencyKey = null;
  function newIdempotencyKey() {
    return (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random());
  }

  function addMessage(text, role) {
    const div = document.createElement("div");
    div.className = "msg " + role;
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  let lastCartSignature = null;
  function updateStatusBar(data) {
    statusEl.textContent = data.status || "browsing";
    const cart = data.cart || [];
    const totalQty = cart.reduce((sum, i) => sum + i.quantity, 0);
    cartCountEl.textContent = totalQty;
    orderIdEl.textContent = data.order ? ("#" + data.order.order_id + " (" + data.order.status + ")") : "none";

    // Cart changed since the last checkout attempt -> old idempotency
    // key no longer represents "this same order", so retire it. A new
    // one is generated the next time Checkout is actually clicked.
    const cartSignature = JSON.stringify(cart);
    if (cartSignature !== lastCartSignature) {
      checkoutIdempotencyKey = null;
    }
    lastCartSignature = cartSignature;
  }

  async function sendMessage(text) {
    addMessage(text, "user");
    const pending = addMessage("...", "bot pending");
    input.value = "";
    form.querySelector("button[type=submit]").disabled = true;

    try {
      const res = await fetch(API_BASE + "/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text, session_id: sessionId }),
      });

      if (!res.ok) {
        let detail = "Something went wrong (" + res.status + ").";
        try {
          const errBody = await res.json();
          if (errBody && errBody.detail) detail = errBody.detail;
        } catch (e) {}
        pending.remove();
        addMessage(detail, "error");
        if (res.status === 409 || res.status === 404) {
          sessionId = null;
          try { localStorage.removeItem("session_id"); } catch (e) {}
        }
        return;
      }

      const data = await res.json();
      sessionId = data.session_id;
      try { localStorage.setItem("session_id", sessionId); } catch (e) {}

      pending.remove();
      addMessage(data.reply, "bot");
      updateStatusBar(data);
    } catch (err) {
      pending.remove();
      addMessage("Could not reach the server. Is it running?", "error");
    } finally {
      form.querySelector("button[type=submit]").disabled = false;
      input.focus();
    }
  }

  async function checkout() {
    if (!sessionId) {
      addMessage("Say hello or add something to your cart before checking out.", "error");
      return;
    }
    if (!checkoutIdempotencyKey) {
      checkoutIdempotencyKey = newIdempotencyKey();
    }

    addMessage("checkout", "user");
    const pending = addMessage("...", "bot pending");
    checkoutBtn.disabled = true;

    try {
      const res = await fetch(API_BASE + "/checkout", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Idempotency-Key": checkoutIdempotencyKey,
        },
        body: JSON.stringify({ session_id: sessionId }),
      });

      if (!res.ok) {
        let detail = "Something went wrong (" + res.status + ").";
        try {
          const errBody = await res.json();
          if (errBody && errBody.detail) detail = errBody.detail;
        } catch (e) {}
        pending.remove();
        addMessage(detail, "error");
        return;
      }

      const data = await res.json();
      pending.remove();
      const itemsText = data.items.map((i) => i.quantity + " x " + i.item).join(", ");
      const note = data.created ? "" : " (already placed — showing your existing order)";
      addMessage("Order #" + data.order_id + " placed: " + itemsText + note, "bot");
      // Cart is now empty server-side; reflect that and retire the key
      // used for this now-completed checkout.
      updateStatusBar({ status: data.status, cart: [], order: { order_id: data.order_id, status: data.status } });
      checkoutIdempotencyKey = null;
    } catch (err) {
      pending.remove();
      addMessage("Could not reach the server. Is it running?", "error");
    } finally {
      checkoutBtn.disabled = false;
    }
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    sendMessage(text);
  });

  document.querySelectorAll(".quick-actions button[data-msg]").forEach((btn) => {
    btn.addEventListener("click", () => sendMessage(btn.dataset.msg));
  });

  const checkoutBtn = document.getElementById("checkout-btn");
  checkoutBtn.addEventListener("click", checkout);

  resetBtn.addEventListener("click", () => {
    sessionId = null;
    checkoutIdempotencyKey = null;
    lastCartSignature = null;
    try { localStorage.removeItem("session_id"); } catch (e) {}
    messagesEl.innerHTML = "";
    statusEl.textContent = "browsing";
    cartCountEl.textContent = "0";
    orderIdEl.textContent = "none";
    addMessage("Welcome! Starting fresh as a new user. Say hi or ask for the menu!", "bot");
  });

  addMessage(
    sessionId
      ? "Welcome back! Continuing your previous session."
      : "Welcome! Ask to see the menu, or tell me what you'd like to order.",
    "bot"
  );
})();
</script>
</body>
</html>
